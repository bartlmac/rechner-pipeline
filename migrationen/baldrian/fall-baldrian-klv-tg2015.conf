# Der Fall der Vorfuehrung: die Uebernahme des Bestands KLV TG2015 der
# (erfundenen) Baldrian Lebensversicherung a. G. Gelesen von fall_starten.sh
# und fall_zeichnen.sh; die Datei wird beim Anlegen als <welt>/fall.conf
# abgelegt.

# Name des Fallverzeichnisses unter faelle/
FALLNAME=baldrian-klv-tg2015

# Die Lieferung (relativ zum Codebaum) und was laut Lieferschein dazugehoert:
# der Lieferschein und seine elf Dateien. Die Auskunftsschreiben im selben
# Verzeichnis gehoeren NICHT dazu — sie entstehen erst auf Rueckfrage und
# werden registriert, wenn sie eintreffen (migrationen/baldrian/lieferungen/README.md).
LIEFERUNG=migrationen/baldrian/lieferungen/baldrian-2
LIEFERDATEIEN="LIEFERSCHEIN.md AVB_KLV_TG2015.pdf Mitteilung_143_KLV_TG2015.pdf Tarifrechner_KLV_TG2015.xlsm
baldrian_bestandsabzug_2026-01-01.csv baldrian_bestandsabzug_2027-01-01.csv
baldrian_erwartungswerte_geschaeftsvorfaelle.json baldrian_erwartungswerte_stichprobe.json
baldrian_erwartungswerte_stichtag.json baldrian_erwartungswerte_verlauf.json
baldrian_gevo_metadaten.csv baldrian_gevo_protokoll_2026.csv"

# Der Stichtag des Zugangs
STICHTAG=2026-01-01

BESCHREIBUNG="Uebernahme des Bestands KLV TG2015 der Baldrian Lebensversicherung a. G. zum 01.01.2026"

# Der Auftrag, den der Vorstand mit A-M6 zeichnet
AUFTRAG="Die Programmleitung fuehrt die Uebernahme des Bestands KLV TG2015 der Baldrian Lebensversicherung a. G. zum Stichtag 01.01.2026 durch: Tarif und Bestand durch die drei Stufen bis zur Migrationsabnahme, danach die Vorbereitung des Zugangs in die Bestandsfuehrung. Grundlage ist die im Fall registrierte Lieferung; eine Nachlieferung wird registriert und neu beauftragt."

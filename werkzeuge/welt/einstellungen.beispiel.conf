# Einstellungen einer Welt — <welt>/einstellungen.conf.
#
# Die Phase `schluessel` von welt_aufstellen.sh erzeugt diese Datei fuer eine
# Welt mit EIGENEN Schluesseln. Wer eine Welt mit vorhandenen Schluesseln und
# vorhandener Zeichnungsordnung aufstellt, legt sie nach dieser Vorlage selbst
# an; die Phase `schluessel` wird dann uebersprungen.
#
# Die Datei wird von der Shell gelesen. Schluessel stehen hier nur als PFAD;
# ihr Inhalt wird von keinem Skript angezeigt. Schluessel, Ordnung und Mandat
# liegen AUSSERHALB von Welt-Ablage, Linie und Codebaum.
#
# Welche Datei welche Rolle traegt, sagt die Ordnung nur ueber den
# Fingerabdruck: `sha256sum <datei>` gibt ihn aus, nie den Schluessel.

WELT="<pfad der welt>"
LINIE="<pfad der welt>/linie"

# Letzter Tag der Ablage ohne uebernommenen Bestand (der Tag vor dem Zugang)
BIS="2025-12-31"

# Zuletzt abgenommener Kern- und Tarifwerksstand: Gegen ihn zeigt die
# Erstabnahme ihre Aenderung (Commit des Codebaums)
VON="e8fa2b4"

# Wer in den Snapshots als Entscheider steht. Die Rolle nennt der Schluessel,
# nicht dieser Text; die Skripte haengen ", als <rolle>" an.
ENTSCHEIDER="<wer zeichnet>"

# Zeichnungsordnung (wird das erste Glied der Linie) und das Mandat der
# simulierten Rollen: fuer die Erstabnahmen (MANDAT) und fuer den Fall
# (MANDAT_FALL; dieselbe Datei ist zulaessig)
ORDNUNG="<pfad>/zeichnungsordnung.json"
MANDAT="<pfad>/mandat.txt"
MANDAT_FALL="<pfad>/mandat.txt"

# Aktuarielle Stellungnahme zur T-Box (Pflichtbeleg der Erstabnahme A-O1) und
# der Vermerk der T-Box-Aenderung (relativ zum Codebaum)
STELLUNGNAHME="<codebaum>/werkzeuge/welt/stellungnahme-tbox-020.json"
TBOX_ARTEFAKT="docs/architektur/adr-024-tbox-020-tarifwerk-gevo-zustandsextrakt.md"

# Betrieb (Rolle betrieb/tageslauf, Klasse betrieb)
BETRIEB_KEY="<pfad>/betrieb.key"

# Menschliche Rollen
VORSTAND_KEY="<pfad>/vorstand.key"
RECHENKERN_KEY="<pfad>/rechenkern.key"
ARCHITEKTUR_KEY="<pfad>/architektur.key"
AKTUARIAT_KEY="<pfad>/aktuariat.key"
BETRIEB_MENSCH_KEY="<pfad>/betrieb-mensch.key"

# Programmleitung des Falls: Der Schluessel steht in keiner Ordnung (ADR-026)
# und entsteht beim Vorlegen des Fallauftrags, wenn die Datei noch nicht liegt.
PROGRAMMLEITUNG_KEY="<pfad>/programmleitung.key"
PROGRAMMLEITUNG_KLASSE=simulation

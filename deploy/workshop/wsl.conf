# /etc/wsl.conf der Arbeitsumgebung (deploy/workshop/Dockerfile).
# Angemeldet wird als der unprivilegierte Benutzer; root bleibt ueber
# `wsl -d <name> -u root` erreichbar.
[user]
default=plv

# Der Windows-Suchpfad bleibt draussen: Ein python oder git von Windows darf
# in dieser Umgebung nie gefunden werden. Windows-Programme sind weiter ueber
# ihren vollen Pfad aufrufbar (/mnt/c/Windows/explorer.exe).
[interop]
appendWindowsPath=false

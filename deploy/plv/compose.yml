# Laufzeitumgebung des PLV-Tagesbetriebs unter ~/apps/plv (Konzept, Abschnitt 8.2).
# Der Container braucht kein Netz: Er liest daten/ und schreibt daten/, sonst nichts.
# Werte kommen aus .env (Vorlage: env.beispiel) — keine Geheimnisse.
services:
  tageslauf:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER in .env setzen}/rechner-pipeline-plv:${IMAGE_TAG:-latest}
    network_mode: none
    user: "${PLV_UID:-1000}:${PLV_GID:-1000}"
    environment:
      TZ: ${ZEITZONE:-Europe/Berlin}
      # Digest des gezogenen Images, vom Menschen nach `docker compose pull`
      # eingetragen (docker image inspect --format '{{index .RepoDigests 0}}');
      # steht in jedem Tagesprotokoll und macht den Stand auf den Code
      # rueckfuehrbar, aus dem er entstand.
      PLV_IMAGE_DIGEST: ${IMAGE_DIGEST:-}
      PLV_IMAGE_TAG: ${IMAGE_TAG:-latest}
    volumes:
      # Kein stilles Anlegen (Angriffsrunde nach T27): Fehlt ./daten — etwa
      # weil ein Neuaufsetzen zwischen seinen zwei Umbenennungen endete —,
      # legte Docker ein leeres root-eigenes Verzeichnis an, und die Ablage
      # war dauerhaft gesperrt. So bricht der Lauf ab, und ein erneutes
      # neuaufsetzen auf dem Host vollendet den Tausch.
      - type: bind
        source: ./daten
        target: /daten
        bind:
          create_host_path: false
    command: ["--stand", "/daten"]

# Durchsetzung statt Freiwilligkeit (Systempruefung Befund 35): die
# Suite laeuft auf jedem Push und Pull Request. Das versionierte, anonymisierte
# O3-/G-2-Fixture wird davor in einer sichtbaren Pflicht-E2E-Stufe gefahren;
# sein Fehlen oder Hashdrift ist ein Fehler, kein Skip. `faelle/` bleibt als
# lokaler Arbeitsbereich gitignoriert und ist keine CI-Vorbedingung. Die volle
# Suite laeuft weiterhin mit `-rs`, damit jeder kuenftige Skip sichtbar bleibt.
#
# Installation ueber die Pin-Dateien, NICHT ueber pip install -e ".[dev]":
# pyproject pinnt nur die direkten Abhaengigkeiten, das Transitive loeste
# pip bei jedem Lauf neu auf. Zusammen mit filterwarnings = ["error"]
# (pyproject.toml) haette eine neue Warnung in einer fremden Bibliothek
# den Build rot gefaerbt, ohne dass sich hier etwas geaendert hat — ein
# Signal ohne Aussage. Die Warnungs-Strenge bleibt deshalb unangetastet;
# reproduzierbar wird stattdessen die Eingabe. requirements-dev.txt ist
# unter CPython 3.11 verifiziert (2026-08-19). Die Matrix prueft zusaetzlich
# Windows sowie die neueste unterstuetzte Python-Linie, weil Pfad- und
# Deprecation-Verhalten plattform- und versionsabhaengig ist.
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - name: Pflicht-E2E O3 und G-2
        run: >-
          python -m pytest -q
          tests/test_o3_fixture_e2e.py
          tests/test_o3_g2_beweisvertrag.py::test_echtes_o3_schreibt_beleg_und_g2_nimmt_denselben_stand_an
      - run: python -m pytest -q -rs

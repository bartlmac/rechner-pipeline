# Durchsetzung statt Freiwilligkeit (Systempruefung Befund 35): die
# Suite laeuft auf jedem Push und Pull Request. Fall-abhaengige Tests
# skippen ehrlich (kein faelle/-Arbeitsbereich im Runner).
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

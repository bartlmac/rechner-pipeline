# Baut und veroeffentlicht die Doku-Engine als optionales ghcr-Image —
# die Toolchain (Quarto/Pandoc/Typst) bleibt aus den Repo-Dependencies
# heraus (Beschluss 2026-08-12). Laeuft nur bei Aenderungen an der Engine.
# Das Versions-Tag kommt aus der FROM-Zeile des Dockerfiles, damit ein neues
# Basis-Image nicht unter dem Tag der alten Version landet.
name: docs-image

on:
  push:
    branches: [main]
    paths: ["werkzeuge/engine/**"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Quarto-Version aus der FROM-Zeile
        id: version
        run: |
          v=$(sed -n 's|^FROM ghcr\.io/quarto-dev/quarto:\([0-9][0-9.]*\)$|\1|p' werkzeuge/engine/Dockerfile)
          if [ "$(printf '%s\n' "$v" | grep -c .)" != 1 ]; then
            echo "Keine eindeutige Quarto-Version in der FROM-Zeile von werkzeuge/engine/Dockerfile" >&2
            exit 1
          fi
          echo "quarto=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: werkzeuge/engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rechner-pipeline-docs:latest
            ghcr.io/${{ github.repository_owner }}/rechner-pipeline-docs:quarto-${{ steps.version.outputs.quarto }}

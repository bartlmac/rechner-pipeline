# Baut und veroeffentlicht das Laufzeit-Image des PLV-Tagesbetriebs
# (deploy/plv/Dockerfile) als ghcr-Image — bei jedem Push auf main mit zwei
# Tags: Commit-Kurzhash und latest (Fachkonzept docs/simulation/tagesbetrieb.md,
# Abschnitt 8.1). Muster: docs-image.yml. Der Kontext ist das Repo (src/ und
# Pin-Dateien); Aenderungen an Doku oder Faellen loesen keinen Bau aus.
name: plv-image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "deploy/plv/**"
      - ".github/workflows/plv-image.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: kurz
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/plv/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rechner-pipeline-plv:latest
            ghcr.io/${{ github.repository_owner }}/rechner-pipeline-plv:${{ steps.kurz.outputs.sha }}

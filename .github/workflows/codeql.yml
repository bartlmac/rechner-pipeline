# CodeQL: statische Sicherheitsanalyse des Python-Codes und der Workflows.
#
# Eigener Workflow neben tests.yml; er aendert die Suite nicht und laeuft
# parallel zu ihr. Python braucht keinen Build-Schritt. Die Befunde erscheinen
# im Reiter Security des Repositorys. Zum Pflicht-Check vor dem Merge wird der
# Workflow erst durch den Branch-Schutz.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

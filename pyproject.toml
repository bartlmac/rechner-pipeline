[build-system]
# Exakt gepinnt (Review T21-10): der isolierte PEP-517-Build loeste
# setuptools und wheel bei jedem frischen Aufbau neu auf — der eine
# Installationsweg war fuer die Laufzeit, nicht fuer den Build
# reproduzierbar. tests/test_abhaengigkeiten.py haelt die Pins exakt.
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rechner-pipeline"
version = "0.1.0"
description = "Migration von Lebensversicherungsbeständen mit Agenten und deterministischem Code (Prototyp)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Bartlomiej Maciaga" },
    { name = "Arno Rasch" },
    { name = "Albrecht Brehm"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

# Runtime dependencies. Pinned to exact versions actually installed from public pypi.org.
dependencies = [
    "openpyxl==3.1.5",
    "oletools==0.60.2",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "matplotlib==3.11.2",
    "pydantic==2.14.3",
    "pypdf==6.21.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.14",
    # ADR-019: Die volle Suite ist die Commit-Vorbedingung und war mit
    # 20:30 untragbar geworden. Mit -n 12 --dist loadfile laeuft sie in
    # 7:25 — gleiche 2373 Tests, gleiches Urteil.
    "pytest-xdist==3.8.0",
]

[project.urls]
Homepage = "https://github.com/bartlmac/rechner-pipeline"
Issues = "https://github.com/bartlmac/rechner-pipeline/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"rechner_pipeline.kern" = ["tafeln.xml"]
"rechner_pipeline.ontologie" = ["landkarte_vorlage.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # oletools 0.60.2 (exakt gepinnt) nutzt Legacy-pyparsing-APIs; nur diese
    # real auftretende Fremdbibliotheks-Warnung wird modul-/kategorie-genau
    # ignoriert — alles andere ist ein Testfehler.
    'ignore::pyparsing.warnings.PyparsingDeprecationWarning:oletools\.olevba',
]

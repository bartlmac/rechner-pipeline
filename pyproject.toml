[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rechner-pipeline"
version = "0.1.0"
description = "Full-agentic, CLI-driven Excel-to-Python actuarial migration pipeline (foundation layer)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Bartlomiej Maciaga" },
    { name = "Arno Rasch" },
    { name = "Albrecht Brehm"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

# Runtime dependencies. Pinned to exact versions actually installed from public pypi.org.
dependencies = [
    "openpyxl==3.1.5",
    "oletools==0.60.2",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "matplotlib==3.11.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.155.5",
]

[project.scripts]
rechner-pipeline = "rechner_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/bartlmac/rechner-pipeline"
Issues = "https://github.com/bartlmac/rechner-pipeline/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"rechner_pipeline.kern" = ["tafeln.xml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

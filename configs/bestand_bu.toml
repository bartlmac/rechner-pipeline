# Beispiel-Konfiguration Bestandsdaten-Modul: selbstaendige Berufsunfaehigkeit.
# Eigene, synthetische Parametrierung (Lehrbeispiel, keine realen Werte).
#
# Rechnungsgrundlagen: DAV 1997 I (Invalidisierung, Aktivensterblichkeit,
# Reaktivierung und Invalidensterblichkeit als Select-Tafeln mit
# Select-Periode 5, je Geschlecht) — unveraendert uebernommen.
# Gueltigkeitsgrenze: ab Alter 70 setzt die Tafel die Invalidisierung auf 1;
# max_endalter muss darunter bleiben (die Config prueft das).
#
# Fachliches Modell des BU-Beispielprodukts (kern/produkte/bu.py): drei
# Zustaende (aktiv / bu / tot), jaehrliche BU-Rente waehrend des
# Leistungsbezugs mit impliziter Beitragsbefreiung, Beitraege ueber die
# volle Versicherungsdauer, keine Karenzzeit, keine Leistungsdynamik.
# Die Ereignis-Engine simuliert die Uebergaenge des Produkts —
# Invalidisierung, Reaktivierung, Tod, Ablauf —, gefuehrt ueber die
# Erfahrungsannahmen unter [annahmen]; die Bewertung bleibt auf erster
# Ordnung. Storno, Beitragsfreistellung und dynamische Erhoehung kennt das
# Produkt nicht, ihre Annahmen wirken nur auf KLV-Generationen.

[meta]
seed = 20260813
beschreibung = "Pfefferminzia LV (PLV): BU-Bestand, zwei Generationen (Lehrbeispiel)"
# Referenzstichtag des Bestands: Grenze zwischen Historie und Prognose
# im Bestandsbericht (cli_report; dessen --stichtag uebersteuert).
# Abschluss und Fortschreibung setzen ihre Stichtage weiterhin explizit.
referenzstichtag = 2026-01-01

# --------------------------------------------------------------------------
# BU-Geschaeft 2000-2016 (DAV 1997 I)
# --------------------------------------------------------------------------
[[generation]]
name = "BU-2000"
knoten = "bu/plv_2000"  # PLV-Tarifgeneration (Ontologie-Knoten)
produkt = "bu"
gueltig_von = 2000-01-01
gueltig_bis = 2016-12-31
sample_size = 500
# Endalter 67: das Produkt endet mit dem Rentenalter — und die DAV 1997 I
# fuehrt ab Alter 70 keine verwendbaren Uebergaenge mehr (i = 1).
max_endalter = 67
zins = 0.0175
# Rechnungsgrundlagen (BU): Aktivensterblichkeit, Invalidisierung,
# Reaktivierung (Select), Invalidensterblichkeit (Select).
tafel_aktiv = "DAV1997_TAA"
tafel_i = "DAV1997_I"
tafel_ri = "DAV1997_RI"
tafel_ti = "DAV1997_TI"
zuschlag = 0.05
# tafel = Sterbetafel-Feld des KLV-Contracts; bei BU fuehrt tafel_aktiv.
tafel = "DAV1997_TAA"

[generation.verteilungen.entry_age]
typ = "normal_trunc"
mean = 33.0
sd = 8.0
min = 20.0
max = 55.0
round = 0

[generation.verteilungen.sex]
typ = "empirical_discrete"
values = ["M", "F"]
probs = [0.58, 0.42]

# Laufzeit bis Endalter: kuerzere Vertraege sind die Ausnahme (die Kappung
# auf max_endalter - entry_age wirkt zusaetzlich im Generator).
[generation.verteilungen.duration]
typ = "empirical_discrete"
values = [15, 20, 25, 30, 35]
probs = [0.10, 0.20, 0.30, 0.30, 0.10]

# Versicherte BU-Jahresrente (Bezugsgroesse der Nachweisung).
[generation.verteilungen.bu_rente]
typ = "lognormal"
meanlog = 9.4
sdlog = 0.35
round = -2

[[generation.korrelation]]
var_i = "entry_age"
var_j = "duration"
rho = -0.55

[[generation.korrelation]]
var_i = "entry_age"
var_j = "bu_rente"
rho = 0.30

# --------------------------------------------------------------------------
# BU-Neugeschaeft ab 2017 (Hoechstrechnungszins 0,9 %), verkauft weiter
# --------------------------------------------------------------------------
[[generation]]
name = "BU-2017"
knoten = "bu/plv_2017"  # PLV-Tarifgeneration (Ontologie-Knoten)
produkt = "bu"
gueltig_von = 2017-01-01
gueltig_bis = 2035-12-31
sample_size = 300
neuzugang_pro_jahr = 30
# Endalter 67: das Produkt endet mit dem Rentenalter — und die DAV 1997 I
# fuehrt ab Alter 70 keine verwendbaren Uebergaenge mehr (i = 1).
max_endalter = 67
zins = 0.009
# Rechnungsgrundlagen (BU): Aktivensterblichkeit, Invalidisierung,
# Reaktivierung (Select), Invalidensterblichkeit (Select).
tafel_aktiv = "DAV1997_TAA"
tafel_i = "DAV1997_I"
tafel_ri = "DAV1997_RI"
tafel_ti = "DAV1997_TI"
zuschlag = 0.05
# tafel = Sterbetafel-Feld des KLV-Contracts; bei BU fuehrt tafel_aktiv.
tafel = "DAV1997_TAA"

[generation.verteilungen.entry_age]
typ = "normal_trunc"
mean = 33.0
sd = 8.0
min = 20.0
max = 55.0
round = 0

[generation.verteilungen.sex]
typ = "empirical_discrete"
values = ["M", "F"]
probs = [0.58, 0.42]

# Laufzeit bis Endalter: kuerzere Vertraege sind die Ausnahme (die Kappung
# auf max_endalter - entry_age wirkt zusaetzlich im Generator).
[generation.verteilungen.duration]
typ = "empirical_discrete"
values = [15, 20, 25, 30, 35]
probs = [0.10, 0.20, 0.30, 0.30, 0.10]

# Versicherte BU-Jahresrente (Bezugsgroesse der Nachweisung).
[generation.verteilungen.bu_rente]
typ = "lognormal"
meanlog = 9.4
sdlog = 0.35
round = -2

[[generation.korrelation]]
var_i = "entry_age"
var_j = "duration"
rho = -0.55

[[generation.korrelation]]
var_i = "entry_age"
var_j = "bu_rente"
rho = 0.30
# --------------------------------------------------------------------------
# Plausibilitaets-Baender fuer das Sanity-Gate (P-B1)
# --------------------------------------------------------------------------
[plausibilitaet]
entry_age = [20, 55]
duration = [10, 40]
bu_rente = [1200, 200000]

# --------------------------------------------------------------------------
# Erfahrungsannahmen (3. Ordnung) der Fortschreibung.
#
# Jede Uebergangswahrscheinlichkeit entsteht aus der Rechnungsgrundlage
# erster Ordnung:  annahme = a + b * erste_ordnung. Die Richtung der
# Sicherheitsmarge steckt in b:
#   * invalidisierung: erste Ordnung vorsichtig HOCH  -> b < 1
#   * reaktivierung:   erste Ordnung vorsichtig NIEDRIG -> b > 1
#   * aktivensterblichkeit (Tod im Anwaerterstand entlastet den Versicherer)
#     und invalidensterblichkeit: hier vorerst ohne Marge (b = 1).
# Storno, Beitragsfreistellung und dynamische Erhoehung kennt das
# BU-Beispielprodukt nicht; ihre Annahmen bleiben auf 0.
# --------------------------------------------------------------------------
[annahmen]
invalidisierung = { a = 0.0, b = 0.8 }
reaktivierung = { a = 0.0, b = 1.25 }
aktivensterblichkeit = { a = 0.0, b = 1.0 }
invalidensterblichkeit = { a = 0.0, b = 1.0 }

# Beispiel-Konfiguration: GESAMTBESTAND eines Lebensversicherers.
#
# Ein Bestand, zwei Versicherungsarten — so, wie ein Unternehmen ihn
# fuehrt: getrennt sind die NACHWEISUNGEN (Bezugsgroesse Versicherungssumme
# gegen Jahresrente, nicht addierbar), nicht der Bestand. Ein Lauf ueber
# diese Config erzeugt daher EINEN Bestand und EINEN Bericht mit beiden
# Nachweisungen.
#
# Kapitallebensversicherung: zehn Generationen entlang der
# Hoechstrechnungszins-Stufen (4,0 % bis 0,25 %, seit 2025 wieder 1,0 %;
# die Stufen im Einzelnen stehen ueber dem jeweiligen Generations-Block).
# Berufsunfaehigkeit: drei Generationen (1,75 / 0,9 / 1,0 %),
# Rechnungsgrundlagen DAV 1997 I. Die jeweils juengste Generation ist im
# Vertrieb — bis heute: Diese Config traegt den Tagesbetrieb der PLV
# ([tagesbetrieb], Fachkonzept docs/simulation/tagesbetrieb.md).
#
# Eigene, synthetische Parametrierung (Lehrbeispiel, keine realen Werte).

[meta]
seed = 20260814
beschreibung = "Pfefferminzia LV (PLV): Gesamtbestand KLV (10 Generationen) und BU (3 Generationen)"
# Referenzstichtag des Bestands: Grenze zwischen Historie und Prognose
# im Bestandsbericht (cli_report; dessen --stichtag uebersteuert).
# Abschluss und Fortschreibung setzen ihre Stichtage weiterhin explizit.
referenzstichtag = 2026-01-01


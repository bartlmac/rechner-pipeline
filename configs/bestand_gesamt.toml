# --------------------------------------------------------------------------
# KLV-Generation 10: KLV-2025, Verkauf ab 2025-01-01 (im Vertrieb)
# Rechnungszins 1,0 %, Tafel DAV2008_T
#
# VORLAEUFIG (Fachkonzept Tagesbetrieb, Abschnitt 10): Die
# Rechnungsgrundlagen der aktuellen Generation legt das Aktuariat der
# Vorzeige fest; bis dahin gelten der Hoechstrechnungszins 2025 (1,0 %)
# und die Kosten der Vorgaengergeneration. Eine Aenderung ist eine
# Fachentscheidung, kein Entwicklerschritt.
# --------------------------------------------------------------------------
[[generation]]
name = "KLV-2025"
knoten = "klv/plv_2025"  # PLV-Tarifgeneration (Ontologie-Knoten)
gueltig_von = 2025-01-01
gueltig_bis = 2035-12-31
# Batch-Dichte wie das Jahresziel (120 je Jahr ueber elf Fensterjahre),
# damit der Bestand am Betriebsbeginn keinen Sprung zeigt: Der Batch
# besiedelt das Fenster nur bis zum Betriebsbeginn (Beginn <= 2026-01-01),
# danach verkauft der Tagesbetrieb Werktag fuer Werktag.
sample_size = 1320
# Jahresziel des Neugeschaefts und sein Trend (Fachkonzept Abschnitt 4):
# Ziel des Jahres J = neuzugang_pro_jahr * (1 + neuzugang_trend)^(J - 2025).
# Im Tagesbetrieb wird das Ziel wochentagsgewichtet auf die Werktage
# verteilt; in der Fortschreibung mit --neuzugang-ab ist es der
# Jahressatz des GeVo-Stroms (ONBOARDING.md Abschnitt 3).
neuzugang_pro_jahr = 120
neuzugang_trend = -0.04
max_endalter = 85
zins = 0.01
tafel = "DAV2008_T"
alpha = 0.025
beta1 = 0.025
gamma1 = 0.0008
gamma2 = 0.00125
gamma3 = 0.0025
policy_fee = 30.0
min_alter_flex = 60
min_rlz_flex = 5


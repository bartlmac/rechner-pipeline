# Endalter 67: das Produkt endet mit dem Rentenalter — und die DAV 1997 I
# fuehrt ab Alter 70 keine verwendbaren Uebergaenge mehr (i = 1).
max_endalter = 67
zins = 0.01
# Rechnungsgrundlagen (BU): Aktivensterblichkeit, Invalidisierung,
# Reaktivierung (Select), Invalidensterblichkeit (Select).
tafel_aktiv = "DAV1997_TAA"
tafel_i = "DAV1997_I"
tafel_ri = "DAV1997_RI"
tafel_ti = "DAV1997_TI"
zuschlag = 0.05
# tafel = Sterbetafel-Feld des KLV-Contracts; bei BU fuehrt tafel_aktiv.
tafel = "DAV1997_TAA"

[generation.verteilungen.entry_age]
typ = "normal_trunc"
mean = 33.0
sd = 8.0
min = 20.0
max = 55.0
round = 0

[generation.verteilungen.sex]
typ = "empirical_discrete"
values = ["M", "F"]
probs = [0.58, 0.42]

# Laufzeit bis Endalter: kuerzere Vertraege sind die Ausnahme (die Kappung
# auf max_endalter - entry_age wirkt zusaetzlich im Generator).
[generation.verteilungen.duration]
typ = "empirical_discrete"
values = [15, 20, 25, 30, 35]
probs = [0.10, 0.20, 0.30, 0.30, 0.10]

# Versicherte BU-Jahresrente (Bezugsgroesse der Nachweisung).
[generation.verteilungen.bu_rente]
typ = "lognormal"
meanlog = 9.4
sdlog = 0.35
round = -2

[[generation.korrelation]]
var_i = "entry_age"
var_j = "duration"
rho = -0.55

[[generation.korrelation]]
var_i = "entry_age"
var_j = "bu_rente"
rho = 0.30

# --------------------------------------------------------------------------
# Tagesbetrieb der PLV (Fachkonzept docs/simulation/tagesbetrieb.md).
#
# betriebsbeginn: erster Tag, an dem Werktag fuer Werktag verkauft wird;
# der Batch-Erzeuger besiedelt die Verkaufsfenster nur bis zu diesem Tag
# (Beginn <= betriebsbeginn) — ein Erzeuger je Zeitfenster. Faellt mit dem
# Referenzstichtag und dem Zugang der Baldrian-Uebernahme zusammen.
# wochentagsgewichte: kein Verkauf am Wochenende, etwas mehr am Montag,
# sonst gleichmaessig (Abschnitt 4).
# meldeverzug_tod: VORLAEUFIG (Abschnitt 10) — lognormal, Median 14 Tage,
# 95 Prozent unter 60 Tagen; Vorschlag des Konzepts, Entscheidung des
# Aktuariats der Vorzeige steht aus.
# --------------------------------------------------------------------------
[tagesbetrieb]
betriebsbeginn = 2026-01-01
wochentagsgewichte = { mo = 1.3, di = 1.0, mi = 1.0, do = 1.0, fr = 1.0, sa = 0.0, so = 0.0 }
meldeverzug_tod = { verteilung = "lognormal", median_tage = 14, p95_tage = 60 }

# --------------------------------------------------------------------------
# Plausibilitaets-Baender fuer das Sanity-Gate (P-B1).
# Die produktfuehrenden Leistungsspalten werden je Produkt geprueft
# (sum_insured bei KLV, bu_rente bei BU) — die jeweils andere ist
# strukturell 0.
# --------------------------------------------------------------------------
[plausibilitaet]
entry_age = [18, 64]
duration = [5, 40]
premium_duration = [5, 35]
sum_insured = [1000, 2000000]
bu_rente = [1200, 200000]

# --------------------------------------------------------------------------
# Erfahrungsannahmen (3. Ordnung) beider Versicherungsarten.
#
# annahme = a + b * erste_ordnung. Der Faktor b rechnet die
# Sicherheitsmarge richtungsrichtig heraus (belastend b < 1, entlastend
# b > 1); Ereignisse ohne Rechnungsgrundlage tragen ihre Rate in a.
# Die Bewertung bleibt unberuehrt auf erster Ordnung.
# --------------------------------------------------------------------------
[annahmen]
# Kapitallebensversicherung
tod = { a = 0.0, b = 0.8 }
storno = { a = 0.03, b = 0.0 }
beitragsfreistellung = { a = 0.01, b = 0.0 }
erhoehung = { a = 0.30, b = 0.0 }
erh_prozent = 0.05
# Berufsunfaehigkeit
invalidisierung = { a = 0.0, b = 0.8 }
reaktivierung = { a = 0.0, b = 1.25 }
aktivensterblichkeit = { a = 0.0, b = 1.0 }
invalidensterblichkeit = { a = 0.0, b = 1.0 }

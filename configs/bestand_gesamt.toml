# BU-Geschaeft 2017-2024 (Hoechstrechnungszins 0,9 %)
# (Bis zum Tagesbetrieb lief das Fenster bis 2035-12; seit dem
# Generationenwechsel zum 2025-01-01 verkauft BU-2025.)
# --------------------------------------------------------------------------
[[generation]]
name = "BU-2017"
knoten = "bu/plv_2017"  # PLV-Tarifgeneration (Ontologie-Knoten)
produkt = "bu"
gueltig_von = 2017-01-01
gueltig_bis = 2024-12-31
# 30 je Jahr ueber acht Fensterjahre — dieselbe Dichte wie der bisherige
# Jahressatz des GeVo-Stroms.
sample_size = 240
# Endalter 67: das Produkt endet mit dem Rentenalter — und die DAV 1997 I
# fuehrt ab Alter 70 keine verwendbaren Uebergaenge mehr (i = 1).
max_endalter = 67
zins = 0.009
# Rechnungsgrundlagen (BU): Aktivensterblichkeit, Invalidisierung,
# Reaktivierung (Select), Invalidensterblichkeit (Select).
tafel_aktiv = "DAV1997_TAA"
tafel_i = "DAV1997_I"
tafel_ri = "DAV1997_RI"
tafel_ti = "DAV1997_TI"
zuschlag = 0.05
# tafel = Sterbetafel-Feld des KLV-Contracts; bei BU fuehrt tafel_aktiv.
tafel = "DAV1997_TAA"

[generation.verteilungen.entry_age]
typ = "normal_trunc"
mean = 33.0
sd = 8.0
min = 20.0
max = 55.0
round = 0

[generation.verteilungen.sex]
typ = "empirical_discrete"
values = ["M", "F"]
probs = [0.58, 0.42]

# Laufzeit bis Endalter: kuerzere Vertraege sind die Ausnahme (die Kappung
# auf max_endalter - entry_age wirkt zusaetzlich im Generator).
[generation.verteilungen.duration]
typ = "empirical_discrete"
values = [15, 20, 25, 30, 35]
probs = [0.10, 0.20, 0.30, 0.30, 0.10]

# Versicherte BU-Jahresrente (Bezugsgroesse der Nachweisung).
[generation.verteilungen.bu_rente]
typ = "lognormal"
meanlog = 9.4
sdlog = 0.35
round = -2

[[generation.korrelation]]
var_i = "entry_age"
var_j = "duration"
rho = -0.55

[[generation.korrelation]]
var_i = "entry_age"
var_j = "bu_rente"
rho = 0.30

# --------------------------------------------------------------------------
# BU-Neugeschaeft ab 2025 (Hoechstrechnungszins 1,0 %), im Vertrieb
#
# VORLAEUFIG (Fachkonzept Tagesbetrieb, Abschnitt 10): Rechnungszins 1,0 %
# und die Grundlagen DAV 1997 I der Vorgaengergeneration, bis das
# Aktuariat der Vorzeige die aktuelle Generation festlegt.
# --------------------------------------------------------------------------
[[generation]]
name = "BU-2025"
knoten = "bu/plv_2025"  # PLV-Tarifgeneration (Ontologie-Knoten)
produkt = "bu"
gueltig_von = 2025-01-01

# Beispiel-Konfiguration: GESAMTBESTAND eines Lebensversicherers.
#
# Ein Bestand, zwei Versicherungsarten — so, wie ein Unternehmen ihn
# fuehrt: getrennt sind die NACHWEISUNGEN (Bezugsgroesse Versicherungssumme
# gegen Jahresrente, nicht addierbar), nicht der Bestand. Ein Lauf ueber
# diese Config erzeugt daher EINEN Bestand und EINEN Bericht mit beiden
# Nachweisungen.
#
# Kapitallebensversicherung: vier Generationen entlang der
# Hoechstrechnungszins-Stufen (4,0 / 2,25 / 0,9 / 0,25 %).
# Berufsunfaehigkeit: zwei Generationen (1,75 / 0,9 %), Rechnungsgrundlagen
# DAV 1997 I. Die jeweils juengste Generation ist im Vertrieb.
#
# Eigene, synthetische Parametrierung (Lehrbeispiel, keine realen Werte).


# Baut die Seite in bartlmac/plv-fiktion und veroeffentlicht sie. Liegt in
# rechner-pipeline unter plv/seite/.github/ und kommt mit dem Rahmen nach
# plv-fiktion; aktiv ist er nur dort.
#
# Die Seite hat zwei Teile (Weg C, Entscheid vom 09.10.2026):
# Der Rahmen ist main dieses Repositorys und aendert sich nur per Pull
# Request. Den Betriebsteil betrieb/ baut dieser Workflow aus dem Zweig
# betrieb, den der Tagesbetrieb jeden Abend schiebt, mit dem Code von
# rechner-pipeline, den CODESTAND in main nennt. Er laeuft bei einem Push auf
# main, von Hand und nach Zeitplan; ein Push auf betrieb startet ihn nicht.
# Scheitert eine Pruefung, wird nicht ausgeliefert, und die Seite vom Vortag
# bleibt stehen. Ausgeliefert wird nur aus main.
#
# Jede Action ist auf einen Commit gepinnt, und zwar auf den, auf den ihr
# Tag beim Lauf vom 11.10.2026 zeigte (gemessen am 15.10.2026); der
# Kommentar nennt die Version.
name: Seite
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Der Tagesbetrieb schiebt um 23:30 Ortszeit (21:30 UTC im Sommer, 22:30
    # im Winter). GitHub startet Zeitplaene verspaetet oder laesst einen aus;
    # darum mehrmals. Ein weiterer Lauf auf denselben Daten baut dieselbe
    # Seite.
    - cron: "50 22 * * *"
    - cron: "50 23 * * *"
    - cron: "50 1 * * *"
    - cron: "50 4 * * *"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Rahmen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: rahmen
          persist-credentials: false
      - name: Zweig betrieb
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: betrieb
          path: zweig
          persist-credentials: false
      - name: CODESTAND
        id: code
        run: |
          stand="$(tr -d '\n' < rahmen/CODESTAND)"
          if ! [[ "$stand" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CODESTAND nennt keinen Commit"; exit 1
          fi
          echo "stand=$stand" >> "$GITHUB_OUTPUT"
      - name: Code aus CODESTAND
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: bartlmac/rechner-pipeline
          ref: ${{ steps.code.outputs.stand }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Wie die Suite von rechner-pipeline: die Pin-Datei, dann das Paket ohne
      # Abhaengigkeiten. python-markdown in der Fassung, mit der die Vorschau
      # lokal misst; Playwright fuer die Breite auf dem Telefon.
      - name: Werkzeuge
        run: |
          python -m pip install -r code/requirements.txt
          python -m pip install --no-deps ./code
          python -m pip install markdown==3.4.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Was im Zweig betrieb liegt
        run: python code/werkzeuge/betriebszweig.py zweig zweig
      # Der gebaute Baum ist main ohne .git; dazu kommt nur betrieb/. Gebaut
      # und geprueft wird ohne Fall: Wache, Verweise, Pages, Paket, die
      # Kennungen unter betrieb/ gegen Paket, Anker und A-B1, die Breite.
      - name: Betriebsteil bauen und pruefen
        env:
          PYTHONPATH: ${{ github.workspace }}/code/src
        run: |
          mkdir seite
          git -C rahmen archive HEAD | tar -x -C seite
          python code/werkzeuge/auftritt.py --teil betrieb --out seite --vorschau vorschau \
            --stands-paket zweig/paket --anker zweig/anker.jsonl --ab1 zweig/A-B1.json \
            --oeffentliches-paket
      - name: Ausserhalb von betrieb/ alles wie in main
        run: python code/werkzeuge/betriebszweig.py rahmen rahmen seite
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./seite
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
  veroeffentlichen:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

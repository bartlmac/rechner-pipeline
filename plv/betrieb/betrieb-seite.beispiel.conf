# Einstellungen des Betriebsteils der Seite (ADR-029) fuer
# plv/betrieb/betrieb_seite.sh. Nach ~/apps/plv/betrieb-seite.conf kopieren
# und ausfuellen.
#
# Die Datei wird von der Shell gelesen. Schluessel stehen hier nur als PFAD;
# kein Skript zeigt ihren Inhalt. Schluessel, Ordnung und Mandat liegen
# ausserhalb von Ablage, Fall-Datenraum und Klon.

# Die Laufzeit (compose.yml, .env, daten/)
PLV="$HOME/apps/plv"

# Wohin der Export das Paket legt (darunter paket/; ein Paket ersetzt das
# vorige) und wo die Ankerdatei liegt (nur anfuegbar, nie im Paket und nie in
# der Ablage)
AUSGABE="$HOME/apps/plv/seite-paket"
ANKER_DIR="<fall-datenraum>/abgeleitet/anker"

# ja: Auslieferung mit A-B1 (Entscheid 2026-10-09); nein: nur Momentaufnahme,
# ohne A-B1 und ohne die Schluessel darunter (ADR-029, Entscheid e, Weg 2)
AUSLIEFERUNG=ja

# Fuer A-B1: der Fall-Datenraum (A-B1 landet unter entscheide/), die
# Ordnungslinie, unter der der Fall gezeichnet ist (nicht die der Laufzeit;
# ADR-029, Entscheid f), die Zeichnungsordnung, das Mandat der simulierten
# Rolle und der Ring. Der LETZTE Schluessel zeichnet (mensch/betrieb); der
# des Vorstands prueft die Glieder der Linie und den Fallauftrag (ADR-029,
# Entscheid e).
FALL="<fall-datenraum>"
LINIE="<pfad>/linie"
ORDNUNG="<pfad>/zeichnungsordnung.json"
MANDAT="<pfad>/mandat.txt"
VORSTAND_KEY="<pfad>/vorstand.key"
BETRIEB_MENSCH_KEY="<pfad>/betrieb-mensch.key"
# Wer im Snapshot als Entscheider steht; die Rolle bestimmt der Schluessel
ENTSCHEIDER="die Routine des Betriebsteils, als mensch/betrieb (Simulation)"

# Ein Klon von plv-fiktion ohne Arbeitsbaum (git clone --bare), origin per
# SSH, und der Deploy-Key, der nur in plv-fiktion schreibt
KLON="$HOME/apps/plv/plv-fiktion.git"
DEPLOY_KEY="<pfad>/plv-fiktion-betrieb_ed25519"

# Wer im Zweig betrieb als Autor steht
AUTOR_NAME="Betriebsdienst PLV"
AUTOR_MAIL="betrieb@plv-fiktion.invalid"
